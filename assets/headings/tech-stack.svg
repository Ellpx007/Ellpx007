<svg xmlns="http://www.w3.org/2000/svg" width="146.0" height="20" viewBox="0 0 146.0 20" role="img" aria-label="Tech Stack">
  <desc>Heading word mark, sized to render 1:1 in an img with height="20".
Typeface: JetBrains Mono Nerd Font Bold Italic (Copyright 2020 The JetBrains Mono Project
Authors, SIL OFL 1.1), subset embedded as a data URI. Geometry: font-size 24 (= GitHub h2,
1.5em of 16px), box height 20 = the glyph baseline, so the img's bottom edge lands exactly on
the text baseline and the words line up with the neighbouring emoji. Consequence: the italic f
descends -18% em and is therefore cut flush at the baseline, giving a tail-less f; the round
letters' -1% overshoot is cut too. That is deliberate. Growing the box to save the tail would
instead lift the words above the emoji's baseline.
Weight: 700. All JetBrains Mono italics share the same advance (0.6em) and the same glyph
bounds, so this geometry is valid for any weight; only the @font-face font-weight and the
font-weight on the text element need changing when swapping faces. Regenerate with:
  pyftsubset JetBrainsMonoNerdFont-BoldItalic.ttf --text="Preferred OSTech StackInterest" \
    --output-file=kiss-heading-subset.ttf --no-hinting --layout-features= --drop-tables+=DSIG
  then rewrite name IDs 1,2,3,4,6,13,14 and re-embed the base64.
Colour is fixed to Morandi pink #EABECA; an SVG in
an img cannot inherit colour or theme.</desc>
  <style>@font-face{font-family:'KISS Heading';font-style:italic;font-weight:700;
    src:url(data:font/ttf;base64,)format('truetype')}</style>
  <text x="1" y="20" font-family="'KISS Heading', 'JetBrainsMono Nerd Font', ui-monospace, monospace"
        font-size="24" font-style="italic" font-weight="700" fill="#EABECA">Tech Stack</text>
</svg>

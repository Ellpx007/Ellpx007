<svg xmlns="http://www.w3.org/2000/svg" width="560" height="72" viewBox="0 0 560 72"
     role="img" aria-label="Keep It Simple, Stupid">
  <desc>Gradient motto banner, self-contained.
Typeface: JetBrains Mono Nerd Font ExtraBold, Copyright 2020 The JetBrains Mono Project
Authors, licensed under SIL OFL 1.1; Nerd Font glyph patching by Nerd Fonts.
A subset covering only the glyphs used in the motto is embedded below as a base64 data URI,
because browsers refuse to load external font files for an SVG referenced through an img
element, which is how GitHub serves this file.
Regenerate the subset after changing the text:
  pyftsubset JetBrainsMonoNerdFont-ExtraBold.ttf --text="Keep It Simple, Stupid" \
    --output-file=kiss-subset.ttf --no-hinting --layout-features= --drop-tables+=DSIG
</desc>
  <style>
    @font-face {
      font-family: 'KISS Banner';
      font-style: normal;
      font-weight: 800;
      src: url(data:font/ttf;base64,) format('truetype');
    }
  </style>
  <defs>
    <linearGradient id="kiss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="50%" stop-color="#F2545B"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
  </defs>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central"
        font-family="'KISS Banner', 'JetBrainsMono Nerd Font', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="34" font-weight="800" fill="url(#kiss)">Keep It Simple, Stupid</text>
</svg>
